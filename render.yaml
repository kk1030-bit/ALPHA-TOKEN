services:
  - type: worker
    name: alpha-token-bot
    env: docker
    plan: starter
    autoDeploy: true
    disk:
      name: alpha-token-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_CHAT_IDS
        sync: false
      - key: WATCH_MODE
        value: dynamic
      - key: TZ
        value: Asia/Taipei
